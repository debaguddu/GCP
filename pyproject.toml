[project]
name = "gcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Debaranjan", email = "debaranjanb91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-beam[gcp]>=2.76.0",
    "google-auth>=2.58.0",
    "google-cloud-storage>=3.14.1",
    "ipykernel>=7.3.0",
    "pandas>=2.0.0,<2.4.0",
    "pip>=26.2.1",
]

[project.scripts]
gcp = "gcp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
]
